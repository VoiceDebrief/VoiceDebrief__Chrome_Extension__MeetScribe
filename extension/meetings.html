<!doctype html>
<html lang="en-GB">
<head><meta charset="utf-8"><title>MeetScribe meetings</title><link rel="stylesheet" href="vd-tokens.css"><link rel="stylesheet" href="ui.css">
<style>
  .cols{display:grid;grid-template-columns:280px 1fr;gap:1rem;max-width:1200px;margin:0 auto}
  @media (max-width:800px){.cols{grid-template-columns:1fr}}
  ul.list{list-style:none;margin:0;padding:0}
  ul.list li{padding:.45rem .5rem;border-radius:7px;cursor:pointer}
  ul.list li.sel,ul.list li:hover{background:var(--panel2)}
  ol.lines button.play{font-size:11px;padding:0 .4rem;margin-left:.4rem}
  .meta{display:grid;grid-template-columns:auto 1fr;gap:.15rem .8rem;font-size:13px}
  .meta .k{color:var(--dim)}
</style></head>
<body>
<header class="bar"><span class="brand">Voice<em>Debrief</em> <b>MeetScribe</b></span><span class="beta">BETA</span><span class="ver" id="ver"></span><nav><a href="options.html">Options</a></nav></header>
<main class="cols">
  <section class="box"><h2>Meetings</h2><ul class="list" id="list"></ul><p class="small dim" id="none" hidden>No meetings yet. Open the side panel on a Meet tab to start.</p></section>
  <section class="box" id="detail" hidden>
    <h2 id="mTitle"></h2>
    <div class="meta" id="meta"></div>
    <div class="row" style="margin-top:.6rem">
      <button id="exTxt">Export TXT</button><button id="exMd">Export Markdown</button><button id="exJson">Export JSON</button>
      <button class="primary" id="debrief">Write the debrief</button><button id="retry">Retry failed</button><button class="danger" id="del">Delete meeting</button><span class="small" id="msg"></span>
    </div>
    <section id="debriefBox" class="debrief" hidden>
      <h2 style="margin-top:1rem">Debrief</h2>
      <p class="small dim" id="debriefMeta"></p>
      <div id="debriefBody"></div>
    </section>
    <h2 style="margin-top:1rem">Transcript</h2>
    <p class="caveat">Written by a model, not a stenographer. It can mishear, and it can add words nobody said. Check anything that matters against the audio.</p>
    <ol class="lines" id="lines" style="margin-top:.6rem"></ol>
  </section>
</main>
<script type="module" src="meetings.js"></script>
</body>
</html>
