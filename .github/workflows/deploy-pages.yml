# MeetScribe CI, on the pattern of Fix the Page (SGit-AI__Website__Chrome-Extension__Fix-The-Page) and its hub:
# validate -> test -> tag -> deploy. Actions are pinned to commit SHAs, the tag in the comment, as the newsroom does.
#
#   1. validate     the gate (admin/build/validate.mjs): generated site pages current, links and anchors, key-shaped
#                   strings, house style, one version across version.txt, manifest and package.json, the manifest
#                   exactly as brief v2.0 section 9 says, and the extension's code rules. Runs on pull requests too.
#   2. test         node tests/run.mjs: unit tests in Node and the extension in Chromium (fake audio device, a local
#                   server replaying OpenRouter). An extension that is not tested is not released.
#   3. tag-release  a push to dev is a MINOR release (vR.M.N -> vR.M.N+1); only a push to main is a MAJOR one
#                   (vR.M.N -> vR.M+1.0), the semantics of OSBot-GitHub-Actions' git__increment-tag. The version
#                   is set in admin/build/version.txt by the release commit (it is baked into the manifest, the
#                   zip and the site, which the gate checks) and must be in its subject ("site vX.Y.Z: ..."). CI
#                   checks the rule, tags the release commit, accepts a main release merged back into dev as
#                   already released, and backfills tags for earlier release commits.
#   4. deploy       publishes the site, the extension's source and its zip to GitHub Pages, from dev only. Never
#                   when validation or the tests failed, never from a pull request or main.
name: deploy-pages
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: Node version (the runner's own; 20 or later)
        run: node -e "const v=+process.versions.node.split('.')[0]; console.log('node', process.version); if (v < 20) process.exit(1)"
      - name: Validate the site and the extension
        run: node admin/build/validate.mjs

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [validate]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Run the tests (unit in Node, the extension in Chromium)
        run: node tests/run.mjs

  tag-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [validate, test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      - name: Tag this release (dev = minor, main = major; backfill missing historical tags)
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --tags --quiet
          git config user.name  'GitHub Actions'
          git config user.email 'actions@github.com'

          # Read the history once, into a variable: piping git log into an early-exiting reader kills it
          # with SIGPIPE under pipefail once the log outgrows the pipe buffer (a Fix the Page lesson).
          LOG=$(git log --format='%H;%s')

          # The version of THIS release, from the file that owns it, and its release commit: the newest
          # commit whose subject carries a version ("site vX.Y.Z: ..."). HEAD on a direct push; HEAD's
          # parent when a pull request lands as a merge commit.
          VER=$(grep -oP '^v\K[0-9]+\.[0-9]+\.[0-9]+' admin/build/version.txt)
          TAG="v$VER"
          NEWEST=$(grep -oP '^[0-9a-f]+;site v\K[0-9]+\.[0-9]+\.[0-9]+(?=:)' <<< "$LOG" | head -1 || true)
          if [ -z "$NEWEST" ]; then echo "::error::no commit carries a version in its subject (\"site vX.Y.Z: ...\")"; exit 1; fi
          if [ "$NEWEST" != "$VER" ]; then echo "::error::version.txt says $TAG but the newest release commit is v$NEWEST"; exit 1; fi
          REL=$(grep -m1 -F ";site v$VER:" <<< "$LOG" | cut -d';' -f1)
          echo "branch $BRANCH, version.txt $TAG, release commit ${REL:0:9}"

          # Already released? A major made on main and merged back into dev arrives here with its tag
          # already on the same commit: that is a sync, not a new release.
          if EXIST=$(git rev-parse -q --verify "refs/tags/$TAG^{commit}"); then
            if [ "$EXIST" = "$REL" ]; then echo "$TAG is already released on ${REL:0:9}: nothing to tag"; exit 0; fi
            echo "::error::$TAG already exists on ${EXIST:0:9}, an earlier commit: version.txt was not bumped"; exit 1
          fi

          # The rule: a push to dev is the next MINOR (vR.M.N -> vR.M.N+1); only a push to main is a
          # MAJOR (vR.M.N -> vR.M+1.0). The same semantics as OSBot-GitHub-Actions' git__increment-tag.
          PREV=$(git tag --list 'v*' | sort -V | tail -1 || true)
          if [ -n "$PREV" ]; then
            NEXT_MINOR=$(echo "$PREV" | awk -F. '{printf "%s.%s.%d", $1, $2, $3+1}')
            NEXT_MAJOR=$(echo "$PREV" | awk -F. '{split($1,a,"v"); printf "v%s.%d.0", a[2], $2+1}')
            if [ "$BRANCH" = "main" ]; then WANT=$NEXT_MAJOR; KIND=major; else WANT=$NEXT_MINOR; KIND=minor; fi
            if [ "$TAG" != "$WANT" ]; then
              echo "::error::a push to $BRANCH is a $KIND release: latest tag is $PREV, so version.txt must be $WANT, not $TAG"; exit 1
            fi
          fi

          # The load-bearing push: this release's tag, on its release commit.
          git tag "$TAG" "$REL"
          git push origin "refs/tags/$TAG"
          echo "tagged ${REL:0:9} as $TAG"

          # Best effort: tags for earlier release commits that have none. GITHUB_TOKEN cannot push a tag
          # to a commit whose tree carries a different .github/workflows file, so some need a human push.
          MISSED=0
          while IFS=';' read -r h s; do
            v=$(printf '%s' "$s" | grep -oP '^site v\K[0-9]+\.[0-9]+\.[0-9]+(?=:)' || true)
            if [ -n "$v" ] && ! git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
              git tag "v$v" "$h"
              if git push origin "refs/tags/v$v" >/dev/null 2>&1; then echo "backfilled v$v -> ${h:0:9}"
              else echo "::warning::could not push backfill tag v$v (GITHUB_TOKEN workflow-file limit)"; MISSED=$((MISSED+1)); fi
            fi
          done <<< "$LOG"
          if [ "$MISSED" -gt 0 ]; then echo "::notice::$MISSED historical tag(s) need a human push: git push origin --tags"; fi
          true

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [validate, test, tag-release]
    # the site is served from dev (as voicedebrief.ai's is); main is tagged, not deployed
    if: always() && github.event_name != 'pull_request' && github.ref != 'refs/heads/main' && needs.validate.result == 'success' && needs.test.result == 'success' && (needs.tag-release.result == 'success' || needs.tag-release.result == 'skipped')
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: Assemble the site
        run: |
          mkdir -p /tmp/site
          rsync -a ./ /tmp/site/ --exclude '.git' --exclude '.github' --exclude 'node_modules' --exclude 'tests/.build' --exclude 'tests/.out'
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: /tmp/site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
